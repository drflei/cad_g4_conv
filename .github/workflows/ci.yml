name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10, 3.11]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install project requirements and testing deps
          if [ -f "cad_g4_conv/requirements.txt" ]; then pip install -r cad_g4_conv/requirements.txt; fi
          pip install pytest trimesh pyg4ometry

      - name: Lint: Black (format)
        run: |
          pip install black
          echo "Running black --check on codebase..."
          black --check cad_g4_conv tests || (echo "Black formatting issues found. Run 'black cad_g4_conv tests' locally to fix." && exit 1)

      - name: Lint: Flake8 (style)
        run: |
          pip install flake8
          echo "Running flake8..."
          flake8 cad_g4_conv tests --max-line-length=88

      - name: Run tests
        working-directory: ./cad_g4_conv
        run: |
          pytest -q

      - name: Smoke test: repair-report and logs
        working-directory: ./cad_g4_conv
        run: |
          python - <<'PY'
import trimesh
from pathlib import Path
p = Path('tests/tmp_ci')
p.mkdir(parents=True, exist_ok=True)
cube = trimesh.creation.box(extents=(10,10,10))
faces = cube.faces.copy()
cube.faces = faces[:-1]
stl = p / 'broken_ci.stl'
cube.export(str(stl))
print('Wrote', stl)
PY
          python cad_g4_conv.py --stl-file tests/tmp_ci/broken_ci.stl --precheck --repair --repair-report tests/tmp_ci/repairs.csv --log-file tests/tmp_ci/convert.log --log-level DEBUG
          if [ ! -f tests/tmp_ci/repairs.csv ]; then echo "repairs.csv missing"; exit 2; fi
          if [ ! -f tests/tmp_ci/convert.log ]; then echo "convert.log missing"; exit 2; fi

      - name: Upload CI artifacts (repair report & logs)
        uses: actions/upload-artifact@v4
        with:
          name: ci-repair-artifacts
          path: cad_g4_conv/tests/tmp_ci/**/*

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-failures
          path: cad_g4_conv/.pytest_cache || .
