name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10, 3.11]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install project requirements and testing deps
          if [ -f "cad_g4_conv/requirements.txt" ]; then pip install -r cad_g4_conv/requirements.txt; fi
          pip install pytest trimesh pyg4ometry

      - name: Run tests
        working-directory: ./cad_g4_conv
        run: |
          pytest -q

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-failures
          path: cad_g4_conv/.pytest_cache || .
